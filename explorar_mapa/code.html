<script>
    const carousel = document.getElementById('carousel');
    const cards = carousel.querySelectorAll('div[class*="snap-center"]');
    
    carousel.addEventListener('scroll', () => {
      const scrollPosition = carousel.scrollLeft;
      const cardWidth = cards[0].offsetWidth + 16; // width + gap
      
      cards.forEach((card, index) => {
        const distance = Math.abs(scrollPosition - (index * cardWidth));
        const threshold = cardWidth / 2;
        
        if (distance < threshold) {
          card.classList.remove('opacity-80', 'scale-95', 'bg-surface-container-lowest/90', 'backdrop-blur-sm');
          card.classList.add('opacity-100', 'scale-100', 'bg-surface-container-lowest', 'shadow-xl');
        } else {
          card.classList.add('opacity-80', 'scale-95', 'bg-surface-container-lowest/90', 'backdrop-blur-sm');
          card.classList.remove('opacity-100', 'scale-100', 'bg-surface-container-lowest', 'shadow-xl');
        }
      });
    });

    // Touch feedback for map markers
    document.querySelectorAll('button[class*="absolute pointer-events-auto"]').forEach(btn => {
      btn.addEventListener('click', function() {
        // Reset others
        document.querySelectorAll('button[class*="absolute pointer-events-auto"]').forEach(b => {
          b.classList.remove('scale-110', 'z-20');
          const inner = b.querySelector('div');
          inner.className = "bg-surface-container-lowest shadow-md px-3 py-1.5 rounded-full flex items-center justify-center";
          inner.querySelector('span').className = "font-label-md text-on-surface text-label-md";
          const arrow = b.querySelector('div:last-child');
          arrow.className = "w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-surface-container-lowest mx-auto -mt-0.5";
          inner.classList.remove('animate-bounce');
        });

        // Set active
        this.classList.add('scale-110', 'z-20');
        const activeInner = this.querySelector('div');
        activeInner.className = "bg-primary shadow-xl px-4 py-2 rounded-full flex items-center justify-center animate-bounce";
        activeInner.querySelector('span').className = "font-label-md text-on-primary text-label-md";
        const activeArrow = this.querySelector('div:last-child');
        activeArrow.className = "w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[10px] border-t-primary mx-auto -mt-0.5";
      });
    });
  </script>

<script>
    // Particle effect on save button click for a "moment of delight"
    document.querySelector('button.bg-secondary-container').addEventListener('click', function(e) {
        const button = e.currentTarget;
        const rect = button.getBoundingClientRect();
        
        for(let i = 0; i < 8; i++) {
            const particle = document.createElement('div');
            particle.className = 'absolute w-2 h-2 rounded-full bg-secondary pointer-events-none';
            particle.style.left = (e.clientX - rect.left) + 'px';
            particle.style.top = (e.clientY - rect.top) + 'px';
            
            button.appendChild(particle);
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 50;
            const tx = Math.cos(angle) * velocity;
            const ty = Math.sin(angle) * velocity;
            
            particle.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
            ], {
                duration: 600,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)'
            }).onfinish = () => particle.remove();
        }
    });

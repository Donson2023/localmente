<script>
  function resetFilters() {
    // Add visual feedback for reset
    const chips = document.querySelectorAll('.chip-active');
    chips.forEach(chip => {
      chip.classList.replace('bg-primary', 'bg-surface-container');
      chip.classList.replace('text-on-primary', 'text-on-surface-variant');
    });
    
    // Animate subtle pop of reset
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined text-sm">done</span>';
    setTimeout(() => {
        btn.textContent = 'Restablecer';
    }, 1000);
  }

  // Interactive micro-interaction for chips
  document.querySelectorAll('button[class*="chip-"]').forEach(button => {
    button.addEventListener('click', () => {
      if (button.classList.contains('bg-primary')) {
        button.classList.replace('bg-primary', 'bg-surface-container');
        button.classList.replace('text-on-primary', 'text-on-surface-variant');
        button.classList.remove('shadow-md');
      } else {
        button.classList.replace('bg-surface-container', 'bg-primary');
        button.classList.replace('text-on-surface-variant', 'text-on-primary');
        button.classList.add('shadow-md');
      }
    });
  });

  // Checkbox micro-interaction
  document.querySelectorAll('label').forEach(label => {
    label.addEventListener('click', () => {
        const check = label.querySelector('.w-6');
        if (check.classList.contains('border-2')) {
            check.className = 'w-6 h-6 rounded bg-primary flex items-center justify-center';
            check.innerHTML = '<span class="material-symbols-outlined text-sm text-on-primary" style="font-size: 18px;">check</span>';
        } else {
            check.className = 'w-6 h-6 rounded border-2 border-outline-variant flex items-center justify-center group-hover:border-primary transition-colors';
            check.innerHTML = '';
        }
    });
  });

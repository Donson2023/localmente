</div>

<script>
    (function() {
      // Scan line animation
      const scanLine = document.getElementById('scan-line');
      let position = 0;
      let direction = 1;
      
      function animateScan() {
        position += 0.5 * direction;
        if (position >= 100 || position <= 0) direction *= -1;
        scanLine.style.transform = `translateY(${position * 4}px)`;
        requestAnimationFrame(animateScan);
      }
      animateScan();

      // Shutter haptic simulation
      const shutter = document.getElementById('shutter');
      shutter.addEventListener('click', () => {
        // Flash effect
        const flash = document.createElement('div');
        flash.className = 'fixed inset-0 bg-white z-[100] pointer-events-none opacity-0 transition-opacity duration-100';
        document.body.appendChild(flash);
        
        setTimeout(() => { flash.style.opacity = '1'; }, 10);
        setTimeout(() => { flash.style.opacity = '0'; }, 150);
        setTimeout(() => { flash.remove(); }, 300);
      });
    })();
  </script>

ly: { 'label-sm': ['Inter'], 'label-md': ['Inter'], 'headline-md': ['Hanken Grotesk'], 'headline-lg': ['Hanken Grotesk'], 'body-sm': ['Inter'], 'body-lg': ['Inter'], 'headline-lg-mobile': ['Hanken Grotesk'], 'body-md': ['Inter'], 'display-lg': ['Hanken Grotesk'] }, fontSize: { 'label-sm': ['12px', { lineHeight: '14px', letterSpacing: '0.04em', fontWeight: '500' }], 'label-md': ['14px', { lineHeight: '16px', letterSpacing: '0.02em', fontWeight: '600' }], 'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }], 'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.01em', fontWeight: '600' }], 'body-sm': ['14px', { lineHeight: '20px', fontWeight: '400' }], 'body-lg': ['18px', { lineHeight: '28px', fontWeight: '400' }], 'headline-lg-mobile': ['28px', { lineHeight: '36px', fontWeight: '600' }], 'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'display-lg': ['48px', { lineHeight: '56px', letterSpacing: '-0.02em', fontWeight: '700' }] } } } };</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } </style><style>

  </head><body class="bg-surface text-on-surface font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin-mobile flex items-center justify-between gap-stack-sm"><div class="flex items-center gap-stack-sm"><button aria-label="Regresar" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-on-surface text-[24px]">arrow_back</span></button><div class="flex items-center gap-stack-sm"><img alt="logo localmente.png" class="h-6 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLtw1iIdTU25EBaFsm4xqybUNsWdC4TJC68ZbuRxfEsD9YL0IRDmgfWs37dzagj4cGX2AxI--ZWfnD3QXAsiI98_xTLAy0L-3bGR0z3TU0pfsr6An6ekfUfBn3sPaCzvrc51yOHpPBjWlYTiAcugsDixwH73IfeUUYcKZKhCxzWWjQzApbUpjoPzEu_AbQhmUOUEnNPWwu1rEnLfmzO1I-pqo1i7WqbwsSouGXzZW4AH_Gqs1SbniNssCjxaWEc2Kmu6VX3Gvl1f"/><span class="font-headline-md text-headline-md text-on-surface truncate max-w-[180px]">Revisión De Datos</span></div></div><div class="flex items-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLslDy91IMUJuCq9gxzVBSubpeCXqketjbl8r1yGpBJoEIcw_ZewE6Pf68qfUK8zfTH3YCYFkVIqcB2PDC28HOXnXV1_CCyxu2MITSWpQxAibW0mBxt0Ev7T0F8RKhb9XtTq5HWKZNDKGAZqfEmygh1jtJl-gHliOdEq7qyIpCdSxzwiylRk6zM3qYzIdHgByB4M0bjSdWaag3ZL7up0-cMVpkj1y_fwOJWRn4A39tyj1qenVfJLB-6kmAE"/></div></div></header><main class="relative w-full pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full">
<!-- Progress Indicator -->
<div class="px-margin-mobile pt-6 pb-2">
<div class="flex items-center justify-between mb-2">
<span class="font-label-md text-label-md text-primary">Paso 2 de 3</span>
<span class="font-label-md text-label-md text-on-surface-variant">66% completado</span>
</div>
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width: 66%"></div>
</div>
</div>
<!-- Decorative Context Card -->
<div class="px-margin-mobile mb-stack-md">
<div class="relative overflow-hidden rounded-lg bg-primary-container p-6 text-on-primary-container">
<div class="relative z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Sobre tu negocio</h1>
<p class="font-body-md text-body-md opacity-90">Cuéntanos qué hace latir tu proyecto. Esta información nos ayuda a asegurar que el espacio sea el ideal para ti.</p>
</div>
<!-- Ambient Decoration -->
<div class="absolute -right-8 -bottom-8 w-32 h-32 bg-on-primary-container/10 rounded-full blur-2xl"></div>
<div class="absolute right-4 top-4">
<span class="material-symbols-outlined text-[48px] opacity-20">storefront</span>
</div>
</div>
</div>
<!-- Form Section -->
<form class="px-margin-mobile flex flex-col gap-stack-md pb-12" id="businessForm">
<!-- Category Selector -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface ml-1">Categoría del negocio</label>
<div class="grid grid-cols-2 gap-3">
<button class="category-btn flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low transition-all duration-200 hover:bg-surface-container-high group active:scale-95" onclick="selectCategory(this, 'Restaurante')" type="button">
<span class="material-symbols-outlined text-primary mb-2 transition-transform group-hover:scale-110">restaurant</span>
<span class="font-label-sm text-label-sm text-on-surface">Restaurante</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low transition-all duration-200 hover:bg-surface-container-high group active:scale-95" onclick="selectCategory(this, 'Boutique')" type="button">
<span class="material-symbols-outlined text-primary mb-2 transition-transform group-hover:scale-110">styler</span>
<span class="font-label-sm text-label-sm text-on-surface">Boutique</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low transition-all duration-200 hover:bg-surface-container-high group active:scale-95" onclick="selectCategory(this, 'Oficina')" type="button">
<span class="material-symbols-outlined text-primary mb-2 transition-transform group-hover:scale-110">work</span>
<span class="font-label-sm text-label-sm text-on-surface">Oficina</span>
</button>
<button class="category-btn flex flex-col items-center justify-center p-4 rounded-lg bg-surface-container-low transition-all duration-200 hover:bg-surface-container-high group active:scale-95" onclick="selectCategory(this, 'Otro')" type="button">
<span class="material-symbols-outlined text-primary mb-2 transition-transform group-hover:scale-110">more_horiz</span>
<span class="font-label-sm text-label-sm text-on-surface">Otro</span>
</button>
</div>
</div>
<!-- Description -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface ml-1" for="description">Descripción de la actividad</label>
<div class="relative">
<textarea class="w-full p-4 rounded-lg bg-surface-container-lowest shadow-sm border-none focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline outline-none transition-all font-body-md text-body-md resize-none" id="description" placeholder="Ej: Venta de café de especialidad y repostería artesanal con enfoque en sostenibilidad..." rows="4"></textarea>
<div class="absolute bottom-3 right-3 text-outline font-label-sm text-label-sm">
<span id="charCount">0</span>/300
        </div>
</div>
</div>
<!-- RUT Section -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface ml-1">Identificación Tributaria (RUT) <span class="text-outline font-normal">(Opcional)</span></label>
<div class="bg-surface-container-low rounded-lg p-4 flex flex-col gap-3">
<div class="flex items-center gap-3 bg-surface-container-lowest p-3 rounded-md shadow-sm">
<span class="material-symbols-outlined text-outline">badge</span>
<input class="bg-transparent border-none outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-outline" placeholder="Ingrese número de RUT" type="text"/>
</div>
<div class="flex items-center justify-center border-2 border-dashed border-outline-variant rounded-md p-6 bg-surface-container-lowest/50 hover:bg-surface-container-highest/30 transition-colors cursor-pointer group" id="fileUpload">
<div class="flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-1 group-hover:animate-bounce">upload_file</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">O sube un archivo (PDF, JPG)</span>
</div>
<input class="hidden" id="rutFile" type="file"/>
</div>
</div>
</div>
<!-- Declaration -->
<label class="flex items-start gap-3 p-4 rounded-lg bg-surface-container-low cursor-pointer active:bg-surface-container-high transition-colors">
<div class="relative flex items-center pt-0.5">
<input class="peer h-5 w-5 cursor-pointer appearance-none rounded-md bg-surface-container-lowest transition-all checked:bg-primary shadow-sm" id="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute left-0 text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none scale-75">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
        Declaro el uso legal del espacio según los <span class="text-primary font-medium underline underline-offset-2">términos y condiciones</span> de Localmente.
      </span>
</label>
<!-- Submit Button -->
<button class="w-full bg-secondary text-on-secondary font-label-md text-label-md py-4 rounded-full shadow-xl hover:shadow-2xl hover:-translate-y-0.5 transition-all active:scale-95 disabled:opacity-50 disabled:grayscale disabled:pointer-events-none flex items-center justify-center gap-2" id="submitBtn" type="submit">
<span>Enviar para revisión</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</form>
<script>
    // Character counter logic
    const textarea = document.getElementById('description');
    const charCount = document.getElementById('charCount');
    textarea.addEventListener('input', () => {
      const count = textarea.value.length;
      charCount.textContent = count;
      if (count > 280) charCount.classList.add('text-error');
      else charCount.classList.remove('text-error');
    });

    // Category selection logic
    function selectCategory(element, value) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-lg');
        btn.classList.add('bg-surface-container-low');
        btn.querySelector('span:first-child').classList.remove('text-on-primary');
        btn.querySelector('span:first-child').classList.add('text-primary');
        btn.querySelector('span:last-child').classList.remove('text-on-primary');
        btn.querySelector('span:last-child').classList.add('text-on-surface');
      });
      
      element.classList.remove('bg-surface-container-low');
      element.classList.add('bg-primary', 'text-on-primary', 'shadow-lg');
      element.querySelector('span:first-child').classList.remove('text-primary');
      element.querySelector('span:first-child').classList.add('text-on-primary');
      element.querySelector('span:last-child').classList.remove('text-on-surface');
      element.querySelector('span:last-child').classList.add('text-on-primary');
    }

    // Mock File Upload Trigger
    document.getElementById('fileUpload').addEventListener('click', () => {
      document.getElementById('rutFile').click();
    });

    // Form validation and feedback
    const businessForm = document.getElementById('businessForm');
    businessForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const terms = document.getElementById('terms');

      if (!terms.checked) {
        terms.parentElement.parentElement.classList.add('ring-2', 'ring-error/20', 'bg-error-container/20');
        setTimeout(() => terms.parentElement.parentElement.classList.remove('ring-2', 'ring-error/20', 'bg-error-container/20'), 2000);
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `
        <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
        <span>Enviando...</span>
      `;
      
      setTimeout(() => {
        btn.classList.remove('bg-secondary');
        btn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
        btn.innerHTML = `
          <span class="material-symbols-outlined">check_circle</span>
          <span>¡Solicitud enviada!</span>
        `;
      }, 2000);
    });
  </script>
</div></main></body></html>

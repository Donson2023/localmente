<!-- Header/Context Section -->
<div class="flex flex-col gap-base mt-stack-md text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Validación Facial</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
            Coloca tu rostro dentro del óvalo. Mantén una expresión neutra y buena iluminación.
        </p>
</div>
<!-- Camera Viewport Area -->
<div class="relative mt-stack-lg flex justify-center items-center overflow-hidden">
<!-- Living Background Glow -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary rounded-full blur-[80px] animate-pulse"></div>
</div>
<!-- The Scanner Container -->
<div class="relative w-full aspect-square max-w-[320px] flex justify-center items-center">
<!-- Rotating Progress Ring (SVG) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 transform" viewbox="0 0 100 100">
<circle class="text-surface-container-highest" cx="50" cy="50" fill="transparent" r="48" stroke="currentColor" stroke-width="1.5"></circle>
<circle class="text-primary transition-all duration-700 ease-out" cx="50" cy="50" fill="transparent" id="progress-ring" r="48" stroke="currentColor" stroke-dasharray="301.59" stroke-dashoffset="301.59" stroke-linecap="round" stroke-width="2.5"></circle>
</svg>
<!-- Oval Mask / Face Frame -->
<div class="relative w-[75%] h-[85%] rounded-[100%/120%] overflow-hidden bg-surface-container-highest shadow-xl">
<!-- User Face Placeholder -->
<img class="w-full h-full object-cover scale-110" data-alt="A front-facing cinematic selfie of a professional person looking calmly at the camera, neutral expression, high-end studio lighting with a subtle blue rim light, soft focus background, ultra-realistic photography style, 8k resolution." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBpX-dMe2HR8jC0QlnycPGRghzUkXl_jVJcQz8R62-VsE1_BYbU4Qh7sl2ogGDKjsv6wJaDaaOJyhjOOFJdV1GGnMhGOahSDk0c_OhZZLmjTTloYFS3ZTQAvgy5RZJ1v4ArKcQfBZOgRIxy9p-W_Sx0y4Pn9z_cV91l56pUW3Hbp2C0sCILweUBfB-Wsd9qpcXoBpxMGPVYx-PLXCRw1fiy5rJBNZ13zqVmDAbSNdpAVWvt_tF2WxJqNCNn1kJ51d10ffgm8X4faU"/>
<!-- Scanning Scanning Line Animation -->
<div class="absolute left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-primary/60 to-transparent shadow-[0_0_15px_rgba(66,0,146,0.8)] opacity-0" id="scan-line"></div>
<!-- Vignette Overlay -->
<div class="absolute inset-0 shadow-[inset_0_0_60px_rgba(19,27,46,0.3)] pointer-events-none"></div>
</div>
<!-- Focus Corners Decor -->
<div class="absolute inset-0 pointer-events-none">
<div class="absolute top-4 left-4 w-6 h-6 border-t-2 border-l-2 border-primary/40 rounded-tl-lg"></div>
<div class="absolute top-4 right-4 w-6 h-6 border-t-2 border-r-2 border-primary/40 rounded-tr-lg"></div>
<div class="absolute bottom-4 left-4 w-6 h-6 border-b-2 border-l-2 border-primary/40 rounded-bl-lg"></div>

</div>
</div>

<div class="mt-stack-md flex justify-center items-center gap-base">
<div class="flex items-center gap-base px-stack-sm py-1.5 rounded-full bg-surface-container text-primary transition-all duration-300" id="status-badge">
<span class="material-symbols-outlined text-[18px] animate-spin" style="animation-duration: 3s;">sync</span>

</div>
</div>
<!-- Tips Section -->
<div class="mt-stack-lg grid grid-cols-3 gap-gutter">
<div class="flex flex-col items-center gap-base text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">light_mode</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Buena luz</span>
</div>
<div class="flex flex-col items-center gap-base text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">visibility</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Sin gafas</span>
</div>
<div class="flex flex-col items-center gap-base text-center">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[24px]">face_6</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Descubierto</span>
</div>
</div>
<!-- Actions -->
<div class="mt-stack-lg mb-stack-md">
<button class="w-full h-14 bg-primary text-on-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-stack-sm shadow-md active:scale-[0.98] transition-transform opacity-50 pointer-events-none" id="capture-btn">
<span class="material-symbols-outlined">photo_camera</span>
            Tomar foto
        </button>
</div>
</div>
<script>
    (function() {
        const ring = document.getElementById('progress-ring');
        const badge = document.getElementById('status-badge');
        const btn = document.getElementById('capture-btn');
        const scanLine = document.getElementById('scan-line');
        const circumference = 301.59;
        
        let progress = 0;
        
        // Simple simulation of facial detection logic
        const simulateScanning = () => {
            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    completeScan();
                }
                
                const offset = circumference - (progress / 100) * circumference;
                ring.style.strokeDashoffset = offset;
                
                // Show scan line once detection "starts"
                if (progress > 10) {
                    scanLine.style.opacity = '1';
                    scanLine.animate([
                        { top: '0%' },
                        { top: '100%' }
                    ], {
                        duration: 2000,
                        iterations: Infinity
                    });
                }
            }, 400);
        };

        const completeScan = () => {
            badge.classList.remove('bg-surface-container', 'text-primary');
            badge.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
            badge.innerHTML = `
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                <span class="font-label-md text-label-md">Rostro detectado</span>
            `;
            
            btn.classList.remove('opacity-50', 'pointer-events-none');
            btn.classList.add('hover:shadow-lg');
            
            // Success haptic-like pulse
            ring.classList.add('text-on-tertiary-container');
            scanLine.style.display = 'none';
        };

        // Delay start for feeling of hardware activation
        setTimeout(simulateScanning, 1000);
        
        btn.addEventListener('click', () => {
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Capturando...';
            setTimeout(() => {
                alert('¡Validación exitosa! Tu identidad ha sido confirmada.');
            }, 800);
        });
    })();
</script></main></body></html>
